name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify the tag matches the packaged version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/NugetDependencyMapper/NugetDependencyMapper.csproj | head -1)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$version</Version> in the csproj. Bump the version before tagging."
            exit 1
          fi
          echo "Publishing version $version"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore NugetDependencyMapper.sln

      - name: Build
        run: dotnet build NugetDependencyMapper.sln -c Release --no-restore

      - name: Test
        run: dotnet run --project tests/NugetDependencyMapper.Tests -c Release

      - name: Pack
        run: dotnet pack src/NugetDependencyMapper -c Release -o artifacts --no-build

      - name: Push to NuGet.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.nupkg
          generate_release_notes: true
